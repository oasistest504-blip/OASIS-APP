<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F4D78" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Oasis Seg." />
    <meta name="description" content="App de seguimiento de personas del Centro de Alabanza Oasis. Los líderes registran personas nuevas, la app las acompaña por WhatsApp desde el número oficial de la iglesia, y el Apóstol ve en un solo panel quién espera oración, quién espera visita y qué líderes cumplieron." />
    <meta property="og:title" content="Oasis Seguimiento" />
    <meta property="og:description" content="App de seguimiento de personas del Centro de Alabanza Oasis. Los líderes registran personas nuevas, la app las acompaña por WhatsApp desde el número oficial de la iglesia, y el Apóstol ve en un solo panel quién espera oración, quién espera visita y qué líderes cumplieron." />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="apple-touch-icon" href="/icono.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Oasis Seguimiento</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              // Buscar actualizaciones de inmediato al cargar
              reg.update().catch(function () {});

              // Revalidar inmediatamente al volver a la app o cambiar a esta pestaña
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                  reg.update().catch(function () {});
                }
              });

              window.addEventListener('focus', function () {
                reg.update().catch(function () {});
              });
            })
            .catch(function (error) {
              console.warn('[PWA] Registro de Service Worker omitido:', error);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
